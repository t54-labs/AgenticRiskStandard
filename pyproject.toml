[project]
name = "ars"
version = "0.1.0"
description = "Agentic Risk Standard — event-sourced settlement protocol for trustworthy AI agent transactions"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pynacl>=1.5",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
]
ap2 = [
    "x402[fastapi,evm]>=2.5",
    "web3>=6.0",
]
client = [
    "httpx>=0.27",
    "click>=8.0",
]
vi = [
    "cryptography>=42.0",
]

[project.scripts]
ars-cli = "abstract_ars_client.cli:main"
ap2-cli = "ap2.client.cli:main"
vi-cli = "vi.client.cli:main"

[project.urls]
Repository = "https://github.com/t54-labs/AgenticRiskStandard"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["abstract_ars*", "ap2*", "vi*"]
